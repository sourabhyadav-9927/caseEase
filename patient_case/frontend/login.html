<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CaseEase | Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
      }
      body.dark {
        background: #121212;
        color: white;
      }

      body.dark nav {
        background: #1e1e1e;
      }

      body.dark .card,
      body.dark .container {
        background: #222;
        color: white;
      }

      body.dark input {
        background: #333;
        color: white;
        border: 1px solid #555;
      }

      .container {
        display: flex;
        width: 900px;
        height: 550px;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      .container:hover {
        display: flex;
        width: 900px;
        height: 550px;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
      }
      body.dark .container:hover {
        display: flex;
        width: 900px;
        height: 550px;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 30px 50px rgba(245, 245, 245, 0.3);
      }

      /* Left Side */

      .left {
        width: 50%;
        background: #451eaf;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        text-align: center;
      }

      .left h1 {
        font-size: 42px;
        margin-bottom: 20px;
      }

      .left p {
        font-size: 18px;
        line-height: 1.6;
      }

      /* Right Side */

      .right {
        width: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      body.dark .right {
        background: #0a0a0a;
      }

      .login-box {
        width: 80%;
      }

      .login-box h2 {
        text-align: center;
        color: #1e3a8a;
        margin-bottom: 30px;
      }
      body.dark .login-box h2 {
        color: white;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #444;
        font-weight: bold;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: #406ac4;
        box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
      }

      .input-group input:hover {
        border-color: #889acc;
        box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
      }

      .forgot {
        text-align: right;
        margin-bottom: 20px;
      }

      .forgot a {
        text-decoration: none;
        color: #2563eb;
        font-size: 14px;
      }
      .forgot a:hover {
        text-decoration: none;
        color: darkblue;
        font-size: 14px;
      }
      body.dark .forgot a:hover {
        color: #3b75f3;
      }

      .login-btn {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-btn:hover {
        background: #1d4ed8;
      }

      .signup {
        margin-top: 20px;
        text-align: center;
      }

      .signup a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
      }
      .signup a:hover {
        text-decoration: underline;
        color: darkblue;
      }
      body.dark .signup a:hover {
        color: #3b75f3;
        text-decoration: underline;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          width: 95%;
          height: auto;
        }

        .left,
        .right {
          width: 100%;
          padding: 40px 20px;
        }
      }
      /* Toggle Switch */

      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      .switch input {
        display: none;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #0000005b;
        transition: 0.4s;
        border-radius: 34px;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        left: 4px;
        bottom: 4px;
        background-color: hsl(0, 100%, 100%);
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: rgb(255, 255, 255);
      }

      input:checked + .slider::before {
        background-color: black;
        transform: translateX(26px);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <label class="switch" style="position: absolute; top: 20px; right: 20px">
        <input type="checkbox" id="themeToggle" />
        <span class="slider"></span>
      </label>
      <div class="left">
        <h1>CaseEase</h1>

        <p>
          Securely manage patient records, clinical history, and case
          documentation from one place.
        </p>
      </div>

      <div class="right">
        <div class="login-box">
          <h2>Login to Your Account</h2>

          <form action="index.html">
            <div class="input-group">
              <label>Email</label>
              <input type="email" placeholder="Enter your email" required />
            </div>

            <div class="input-group">
              <label>Password</label>
              <input
                type="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="forgot">
              <a href="#">Forgot Password?</a>
            </div>

            <button class="login-btn" type="submit">Login</button>
          </form>

          <div class="signup">
            Don't have an account?
            <a class="signup-link" href="#">Register</a>
          </div>
        </div>
      </div>
    </div>

    <script >
      const toggle = document.getElementById("themeToggle");
      toggle.addEventListener("change", () => {
        document.body.classList.toggle("dark");
      });
      const passwordInput = document.querySelector('input[type="password"]');

      if (passwordInput) {
        passwordInput.addEventListener("input", function () {
          if (
            passwordInput.value.length < 6 ||
            passwordInput.value.length > 20
          ) {
            passwordInput.setCustomValidity(
              "Password must be between 6 and 20 characters long.",
            );
          } else {
            passwordInput.setCustomValidity("");
          }
        });
      }
    </script>
  </body>
</html>
