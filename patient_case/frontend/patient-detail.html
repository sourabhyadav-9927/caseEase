<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CaseEase — AI Case Taking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f0;
        --surface: #ffffff;
        --surface-sunken: #f5f7f5;
        --ink: #1c2624;
        --ink-soft: #5b6b68;
        --ink-faint: #8c9a97;
        --border: #dde5e1;
        --teal-900: #123f3a;
        --teal-700: #1e5f58;
        --teal-600: #23786e;
        --teal-050: #e4f0ec;
        --brick-700: #a6473a;
        --brick-050: #f7e9e6;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* NAVBAR */

      nav {
        height: 68px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        cursor: pointer;
      }

      .brand .mark {
        font-family: "Newsreader", serif;
        font-weight: 500;
        font-size: 22px;
        color: var(--teal-900);
      }

      .brand .tag {
        font-size: 12px;
        color: var(--ink-faint);
        letter-spacing: 0.01em;
      }

      .ai-status {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        color: var(--ink-soft);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal-600);
        position: relative;
      }

      .status-dot::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid var(--teal-600);
        opacity: 0.5;
        animation: pulse-ring 2.4s ease-out infinite;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.6);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      .end-case {
        background: transparent;
        color: var(--brick-700);
        border: 1px solid var(--brick-700);
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .end-case:hover {
        background: var(--brick-700);
        color: white;
      }

      /* MAIN */

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
        min-height: 0;
      }

      /* PATIENT INFO STRIP */

      .patient-info {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 28px;
      }

      .patient-info .field {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .patient-info .field span:first-child {
        font-size: 11px;
        color: var(--ink-faint);
      }

      .patient-info .field span:last-child {
        font-size: 14px;
        color: var(--ink);
        font-weight: 500;
      }

      /* CHAT */

      .chat-container {
        flex: 1;
        padding: 28px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .message {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        opacity: 0;
        transform: translateY(6px);
        animation: rise 0.35s ease forwards;
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.ai {
        justify-content: flex-start;
      }
      .message.user {
        justify-content: flex-end;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--teal-050);
        color: var(--teal-700);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
        font-family: "Newsreader", serif;
      }

      .bubble-wrap {
        display: flex;
        flex-direction: column;
        max-width: 72%;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: var(--radius-md);
        line-height: 1.55;
        font-size: 15px;
      }

      .ai .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
        color: var(--ink);
      }

      .user .bubble {
        background: var(--teal-700);
        color: white;
        border-top-right-radius: 4px;
      }

      .ai-name {
        font-size: 11.5px;
        color: var(--ink-faint);
        margin-bottom: 4px;
      }

      /* TYPING */

      .typing-row {
        display: none;
        gap: 10px;
        margin-bottom: 18px;
      }

      .typing-row.visible {
        display: flex;
      }

      .typing-bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
        border-radius: var(--radius-md);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .typing-bubble span {
        width: 6px;
        height: 6px;
        background: var(--ink-faint);
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .typing-bubble span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-bubble span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-4px);
        }
      }

      /* INPUT */

      .input-area {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 16px 24px;
        display: flex;
        gap: 10px;
        flex-shrink: 0;
      }

      .input-area textarea {
        flex: 1;
        resize: none;
        height: 48px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 13px 16px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        background: var(--surface-sunken);
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .input-area textarea:focus {
        border-color: var(--teal-600);
        background: var(--surface);
      }

      .input-area textarea:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .send-btn {
        width: 48px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--teal-700);
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .send-btn:hover {
        background: var(--teal-900);
      }

      .send-btn:disabled {
        background: var(--ink-faint);
        cursor: not-allowed;
      }

      /* ERROR NOTICE */

      .api-error {
        display: none;
        margin: 0 24px 14px;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: var(--brick-050);
        color: var(--brick-700);
        font-size: 13px;
      }

      .api-error.visible {
        display: block;
      }

      @media (max-width: 600px) {
        nav {
          padding: 0 16px;
        }
        .brand .tag {
          display: none;
        }
        .patient-info {
          padding: 12px 16px;
        }
        .chat-container {
          padding: 20px 14px;
        }
        .bubble-wrap {
          max-width: 86%;
        }
        .input-area {
          padding: 12px 14px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="brand" onclick="window.location.href = 'case.html'">
        <span class="mark">CaseEase</span>
        <span class="tag">AI case intake</span>
      </div>
      <div class="ai-status">
        <span class="status-dot"></span>
        Listening
      </div>
      <button class="end-case" onclick="endCase()">End case</button>
    </nav>

    <div class="main">
      <div class="patient-info">
        <div class="field">
          <span>Patient</span><span id="patientName">Patient</span>
        </div>
        <div class="field"><span>Age</span><span id="patientAge">—</span></div>
        <div class="field">
          <span>Gender</span><span id="patientGender">—</span>
        </div>
        <div class="field">
          <span>Chief complaint</span><span id="chiefComplaint">—</span>
        </div>
      </div>

      <div class="chat-container" id="chatContainer"></div>

      <div class="typing-row" id="typing">
        <div class="avatar">CE</div>
        <div class="typing-bubble"><span></span><span></span><span></span></div>
      </div>

      <div class="api-error" id="apiError"></div>

      <div class="input-area">
        <textarea
          id="messageInput"
          placeholder="Type your answer..."
          onkeydown="handleKey(event)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <script src="patient-detail.js"></script>
  </body>
</html>
